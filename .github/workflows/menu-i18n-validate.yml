name: Partes — menu i18n (FE parity)

on:
  pull_request:
    paths:
      - 'backend/database/**/PqMenu*.php'
      - 'backend/database/**/pq_menus**'
      - 'backend/database/seeders/**'
      - 'backend/database/sp/**menu**'
      - 'frontend/src/features/auth/productI18n.ts'
      - '.github/workflows/menu-i18n-validate.yml'

permissions:
  contents: read

jobs:
  product-i18n-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci (Cloudsmith)
        env:
          CLOUDSMITH_READ_TOKEN: ${{ secrets.CLOUDSMITH_READ_TOKEN }}
        run: |
          if [ -z "${CLOUDSMITH_READ_TOKEN:-}" ]; then
            echo "Falta secret CLOUDSMITH_READ_TOKEN en GitHub Actions (Settings → Secrets)." >&2
            exit 1
          fi
          echo "::add-mask::${CLOUDSMITH_READ_TOKEN}"
          npm ci

      - name: Vitest menu i18n
        run: npm run test -- --run src/features/partes/partesMenuI18n.test.ts
