name: Partes — validate installation manifest

on:
  pull_request:
    paths:
      - 'backend/database/**'
      - 'backend/tools/build-installation-manifest.php'
      - 'backend/tools/validate-installation-manifest.php'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - '.github/workflows/manifest-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Composer install (Cloudsmith)
        env:
          CLOUDSMITH_READ_TOKEN: ${{ secrets.CLOUDSMITH_READ_TOKEN }}
        run: |
          if [ -z "${CLOUDSMITH_READ_TOKEN:-}" ]; then
            echo "Falta secret CLOUDSMITH_READ_TOKEN en GitHub Actions (Settings → Secrets)." >&2
            exit 1
          fi
          echo "::add-mask::${CLOUDSMITH_READ_TOKEN}"
          # Mismo contrato que Forge: auth.json http-basic (dl.cloudsmith.io) + repo entitlement efímero.
          bash scripts/forge-composer-install.sh

      - name: Regenerate host manifest (check drift)
        run: php tools/build-installation-manifest.php

      - name: Assert manifest committed
        run: git diff --exit-code database/manifest/

      - name: Validate merge Framework + host
        run: php tools/validate-installation-manifest.php
