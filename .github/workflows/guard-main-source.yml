name: Guard main PR source

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  only-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Require an allowed source branch for main
        if: github.base_ref == 'main'
        run: |
          if [[ "${{ github.head_ref }}" =~ ^(develop|v[0-9]+\.[0-9]+\.[0-9]+|[0-9]+\.[0-9]+\.[0-9]+-FINAL)$ ]]; then
            exit 0
          fi

          echo "Pull requests into main must come from develop or a supported release branch (vX.Y.Z or X.Y.Z-FINAL)."
          exit 1
      - run: echo "Branch policy passed"
